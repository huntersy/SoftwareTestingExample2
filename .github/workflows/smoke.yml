name: Playwright Smoke E2E
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  smoke:
    name: Build and Run Smoke E2E Tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - name: Install Chromium
        shell: pwsh
        run: .\bin\Release\net8.0\playwright.ps1 install chromium
      - name: Run smoke tests
        run: dotnet test --no-build --no-restore --configuration Release --filter "TestCategory=Smoke" --logger "trx;LogFileName=smoke-results.trx" --results-directory TestResults
      - name: Publish NUnit report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Playwright Smoke Results
          path: TestResults/*.trx
          reporter: dotnet-trx
          list-tests: all
          fail-on-empty: false
      - name: Upload reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-artifacts
          path: |
            TestResults/**/*.trx
            **/TestResults/FailureArtifacts/**
          if-no-files-found: warn
          retention-days: 14
